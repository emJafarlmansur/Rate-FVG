<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Storyteller & Rate Card</title>

    <!-- 1. Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. React & Babel CDN -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Favicon Tab Browser -->
  <link rel="icon" type="image/png" sizes="82x82" href="./images/favicon.png" />
  <!-- Favicon Layar HP (Apple / Android) -->
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon.png" />
  </head>
  <body
    class="min-h-screen bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-500/20 via-slate-950 to-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-black"
  >
    <!-- Container Utama Tempat React Ditampilkan -->
    <div id="root"></div>

    <!-- Script React & JSX -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      function MainApp() {
        const [selectedPackage, setSelectedPackage] = useState("hybrid");
        const [includeDrone, setIncludeDrone] = useState(true);
        const [extraHours, setExtraHours] = useState(0);

        // State untuk Modal Video YouTube Portfolio
        const [activeVideoId, setActiveVideoId] = useState(null);

        // State Filter Portfolio
        const [portfolioFilter, setPortfolioFilter] = useState("all");

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [
          selectedPackage,
          includeDrone,
          extraHours,
          activeVideoId,
          portfolioFilter,
        ]);

        // DATA PAKET RATE CARD
        const packages = {
          photo: {
            name: "Photography (FG)",
            basePrice: 500000,
            description:
              "Fokus dokumentasi foto berkualitas tinggi untuk momen penting Anda.",
            features: [
              "Maksimal 3 Jam Coverage",
              "All Unedited Files (Google Drive)",
              "15 Edited Photos (Color Graded)",
              "1 Fitur Operator Kamera",
            ],
          },
          video: {
            name: "Videography (VG)",
            basePrice: 700000,
            description:
              "Dokumentasi video cinematic dengan alur cerita yang menarik.",
            features: [
              "Maksimal 3 Jam Coverage",
              "1 Video Cinematic Highlight (1-2 Menit)",
              "Resolusi Full HD / 4K",
              "Audio Mixing & Color Grading",
            ],
          },
          hybrid: {
            name: "Hybrid Combo (VG + FG)",
            basePrice: 1200000,
            description:
              "Solusi lengkap foto & video untuk hasil dokumentasi yang maksimal.",
            features: [
              "Maksimal 5 Jam Coverage",
              "All Raw Files & Unedited Photos",
              "25 Edited Photos",
              "1 Video Cinematic Highlight (1-2 Menit)",
              "Bebas Revisi Minor 2x",
            ],
          },
        };

        // DATA PORTOFOLIO (Mudah ditambah/diedit)
        const portfolioItems = [
          {
            id: 1,
            title: "Cinematic Local Community Event",
            category: "video",
            youtubeId: "dQw4w9WgXcQ", // Gantilah dengan ID Video YouTube Anda
            thumbnail:
              "https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=800&q=80",
            description:
              "Dokumentasi acara komunitas dengan nuansa sinematik dan visual aerial drone.",
          },
          {
            id: 2,
            title: "Aerial Drone Landscape Footage",
            category: "drone",
            youtubeId: "dQw4w9WgXcQ", // Gantilah dengan ID Video YouTube Anda
            thumbnail:
              "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80",
            description:
              "Pengambilan gambar udara presisi tinggi menggunakan DJI Mini 2 SE.",
          },
          {
            id: 3,
            title: "Event Portrait & Moment Capture",
            category: "photo",
            youtubeId: null,
            externalUrl: "https://instagram.com",
            thumbnail:
              "https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80",
            description:
              "Foto momen ekspresif dan detail warna tajam khas S-Log2 color grading.",
          },
        ];

        const filteredPortfolio =
          portfolioFilter === "all"
            ? portfolioItems
            : portfolioItems.filter(
                (item) => item.category === portfolioFilter,
              );

        const currentBasePrice = packages[selectedPackage].basePrice;
        const dronePrice = includeDrone ? 250000 : 0;
        const extraHoursPrice = extraHours * 100000;
        const totalPrice = currentBasePrice + dronePrice + extraHoursPrice;

        const formatRupiah = (number) => {
          return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0,
          }).format(number);
        };

        const waNumber = "081216120922";
        const waMessage = `Halo! Saya tertarik untuk booking jasa visual.%0A%0A- *Paket:* ${packages[selectedPackage].name}%0A- *Layanan Drone:* ${includeDrone ? "Ya" : "Tidak"}%0A- *Tambahan Waktu:* ${extraHours} Jam%0A- *Estimasi Biaya:* ${formatRupiah(totalPrice)}`;
        const waLink = `https://wa.me/${waNumber}?text=${waMessage}`;

        return (
          <div class="min-h-screen bg-gradient-to-r from-slate-950 via-amber-500/10 to-slate-950 text-slate-100">
            {/* STICKY NAVBAR */}
            <nav class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-amber-500/20 px-6 py-4">
              <div class="max-w-6xl mx-auto flex justify-between items-center">
                <a
                  href="#home"
                  class="text-lg font-extrabold tracking-wider text-amber-400 flex items-center gap-2"
                >
                  <i data-lucide="aperture" class="w-6 h-6"></i> VISUAL STORY
                </a>
                <div class="hidden md:flex items-center gap-6 text-sm font-medium">
                  <a
                    href="#about"
                    class="hover:text-amber-400 transition-colors"
                  >
                    Tentang Saya
                  </a>
                  <a
                    href="#portfolio"
                    class="hover:text-amber-400 transition-colors"
                  >
                    Portofolio
                  </a>
                  <a
                    href="#pricing"
                    class="hover:text-amber-400 transition-colors"
                  >
                    Paket & Harga
                  </a>
                  <a
                    href="#contact"
                    class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl font-bold transition-all"
                  >
                    Hubungi Saya
                  </a>
                </div>
              </div>
            </nav>

            {/* HERO SECTION (#home) */}
            <section
              id="home"
              class="relative py-24 px-6 text-center max-w-4xl mx-auto"
            >
              <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-3 py-1.5 rounded-full mb-6 backdrop-blur-sm">
                <i data-lucide="compass" class="w-4 h-4"></i> Visual
                Storytelling & Event Documentation
              </div>
              <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 text-white drop-shadow-md">
                Abadikan Momen Berharga Dengan Tampilan Sinematik
              </h1>
              <p class="text-slate-300 text-base md:text-lg mb-8 max-w-2xl mx-auto">
                Layanan Fotografi & Videografi profesional dengan pengerjaan
                warna mendetail, tampilan udara aerial, dan struktur harga
                transparan.
              </p>
              <div class="flex flex-wrap justify-center gap-4">
                <a
                  href="#portfolio"
                  class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-amber-500/20"
                >
                  Lihat Portofolio
                </a>
                <a
                  href="#pricing"
                  class="bg-slate-900 hover:bg-slate-800 border border-amber-500/30 text-slate-200 font-semibold px-6 py-3 rounded-xl transition-all"
                >
                  Hitung Estimasi Biaya
                </a>
              </div>
            </section>

            {/* TENTANG SAYA SECTION (#about) */}
            <section
              id="about"
              class="py-16 max-w-5xl mx-auto px-6 border-t border-slate-900"
            >
              <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
                <div class="space-y-4">
                  <span class="text-amber-400 text-xs font-bold uppercase tracking-widest block">
                    Tentang Kreator
                  </span>
                  <h2 class="text-3xl font-extrabold text-white">
                    Menyajikan Cerita Visual dengan Kualitas Profesional
                  </h2>
                  <p class="text-slate-300 text-sm leading-relaxed">
                    Saya berfokus pada pengerjaan dokumentasi video sinematik
                    dan fotografi acara. Berbekal pengalaman teknis alur kerja
                    pascaproduksi serta integrasi pengambilan gambar udara,
                    setiap momen ditangkap secara autentik dan berkelas.
                  </p>

                  {/* GEAR & HARDWARE HIGHLIGHT */}
                  <div class="pt-4 grid grid-cols-2 gap-4 text-xs text-slate-300">
                    <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex items-center gap-3">
                      <i
                        data-lucide="camera"
                        class="w-5 h-5 text-amber-400 shrink-0"
                      ></i>
                      <div>
                        <span class="font-bold block text-white">
                          Sony ZV-E10
                        </span>
                        <span>4K & S-Log2 Profile</span>
                      </div>
                    </div>
                    <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex items-center gap-3">
                      <i
                        data-lucide="plane"
                        class="w-5 h-5 text-amber-400 shrink-0"
                      ></i>
                      <div>
                        <span class="font-bold block text-white">
                          DJI Mini 2 SE
                        </span>
                        <span>Aerial Video 2.7K</span>
                      </div>
                    </div>
                    <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex items-center gap-3">
                      <i
                        data-lucide="film"
                        class="w-5 h-5 text-amber-400 shrink-0"
                      ></i>
                      <div>
                        <span class="font-bold block text-white">
                          DaVinci Resolve
                        </span>
                        <span>Color Grading Presisi</span>
                      </div>
                    </div>
                    <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex items-center gap-3">
                      <i
                        data-lucide="check-circle-2"
                        class="w-5 h-5 text-amber-400 shrink-0"
                      ></i>
                      <div>
                        <span class="font-bold block text-white">
                          Hasil Cepat
                        </span>
                        <span>Penyerahan via Drive</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="relative">
                  <div class="aspect-square bg-slate-900 rounded-2xl border border-amber-500/20 overflow-hidden shadow-2xl relative">
                    <img
                      src="./images/profile.jpg"
                      alt="Behind the scene"
                      class="w-full h-full object-cover object-top opacity-80 hover:scale-105 transition-transform duration-500"/>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                    <div class="absolute bottom-4 left-4 right-4 p-4 bg-slate-950/80 backdrop-blur-md rounded-xl border border-slate-800">
                      <p class="text-xs text-amber-400 font-bold">
                        Visual Excellence
                      </p>
                      <p class="text-xs text-slate-300">
                        Menghadirkan kenangan berharga dalam setiap frame video
                        dan foto.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* PORTOFOLIO SECTION (#portfolio) */}
            <section
              id="portfolio"
              class="py-16 max-w-6xl mx-auto px-6 border-t border-slate-900"
            >
              <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-white mb-3">
                  Galeri Portofolio
                </h2>
                <p class="text-slate-400 text-sm max-w-md mx-auto">
                  Berikut adalah kumpulan karya highlight video sinematik, foto
                  acara, dan rekaman visual udara.
                </p>

                {/* FILTER BUTTONS */}
                <div class="flex justify-center gap-2 mt-6">
                  {["all", "video", "photo", "drone"].map((filter) => (
                    <button
                      key={filter}
                      onClick={() => setPortfolioFilter(filter)}
                      class={`px-4 py-1.5 rounded-full text-xs font-semibold capitalize transition-all ${
                        portfolioFilter === filter
                          ? "bg-amber-500 text-slate-950"
                          : "bg-slate-900 text-slate-400 hover:text-white border border-slate-800"
                      }`}
                    >
                      {filter === "all" ? "Semua" : filter}
                    </button>
                  ))}
                </div>
              </div>

              {/* GRID PORTOFOLIO */}
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                {filteredPortfolio.map((item) => (
                  <div
                    key={item.id}
                    class="group bg-slate-900/60 rounded-2xl border border-slate-800 overflow-hidden hover:border-amber-500/50 transition-all duration-300"
                  >
                    <div class="relative aspect-video overflow-hidden bg-slate-950">
                      <img
                        src={item.thumbnail}
                        alt={item.title}
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                      />
                      <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        {item.youtubeId ? (
                          <button
                            onClick={() => setActiveVideoId(item.youtubeId)}
                            class="bg-amber-500 text-slate-950 p-3 rounded-full shadow-lg transform group-hover:scale-110 transition-transform"
                          >
                            <i
                              data-lucide="play"
                              class="w-6 h-6 fill-current"
                            ></i>
                          </button>
                        ) : (
                          <a
                            href={item.externalUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            class="bg-amber-500 text-slate-950 p-3 rounded-full shadow-lg transform group-hover:scale-110 transition-transform"
                          >
                            <i data-lucide="external-link" class="w-6 h-6"></i>
                          </a>
                        )}
                      </div>
                    </div>
                    <div class="p-5">
                      <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                        {item.category}
                      </span>
                      <h3 class="text-base font-bold text-white mt-2 mb-1">
                        {item.title}
                      </h3>
                      <p class="text-slate-400 text-xs">{item.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* RATE CARD & CALCULATOR SECTION (#pricing) */}
            <section
              id="pricing"
              class="py-16 max-w-6xl mx-auto px-6 border-t border-slate-900"
            >
              <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold text-white mb-3">
                  Layanan & Kalkulator Biaya
                </h2>
                <p class="text-slate-400 text-sm max-w-md mx-auto">
                  Pilih paket dan tambahkan kebutuhan ekstra untuk mendapatkan
                  estimasi total biaya secara langsung.
                </p>
              </div>

              {/* PACKAGE SELECTION */}
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                {Object.keys(packages).map((key) => {
                  const pkg = packages[key];
                  const isSelected = selectedPackage === key;
                  return (
                    <div
                      key={key}
                      onClick={() => setSelectedPackage(key)}
                      class={`cursor-pointer rounded-2xl p-6 transition-all duration-300 border backdrop-blur-md ${
                        isSelected
                          ? "bg-slate-900/90 border-amber-500 shadow-xl shadow-amber-500/20 scale-105"
                          : "bg-slate-900/60 border-slate-800/80 hover:border-amber-500/50"
                      }`}
                    >
                      <div class="flex justify-between items-start mb-4">
                        {key === "photo" && (
                          <i
                            data-lucide="camera"
                            class="w-8 h-8 text-amber-400"
                          ></i>
                        )}
                        {key === "video" && (
                          <i
                            data-lucide="video"
                            class="w-8 h-8 text-amber-400"
                          ></i>
                        )}
                        {key === "hybrid" && (
                          <i
                            data-lucide="layers"
                            class="w-8 h-8 text-amber-400"
                          ></i>
                        )}
                        {key === "hybrid" && (
                          <span class="bg-amber-500 text-slate-950 font-bold text-[10px] px-2 py-0.5 rounded-full uppercase shadow-md">
                            Recommended
                          </span>
                        )}
                      </div>
                      <h3 class="text-xl font-bold text-white mb-2">
                        {pkg.name}
                      </h3>
                      <p class="text-slate-400 text-xs mb-4">
                        {pkg.description}
                      </p>
                      <div class="text-2xl font-extrabold text-amber-400 mb-6">
                        {formatRupiah(pkg.basePrice)}
                      </div>
                      <ul class="space-y-2 mb-6">
                        {pkg.features.map((feature, idx) => (
                          <li
                            key={idx}
                            class="flex items-center gap-2 text-xs text-slate-300"
                          >
                            <i
                              data-lucide="check-circle-2"
                              class="w-4 h-4 text-amber-500 shrink-0"
                            ></i>
                            {feature}
                          </li>
                        ))}
                      </ul>
                    </div>
                  );
                })}
              </div>

              {/* CALCULATOR */}
              <div class="max-w-3xl mx-auto bg-slate-900/80 backdrop-blur-md border border-amber-500/20 rounded-3xl p-6 md:p-8 shadow-2xl">
                <h3 class="text-xl font-bold mb-6 text-slate-100 text-center">
                  Atur Opsi Tambahan
                </h3>
                <div class="space-y-6">
                  {/* Opsi Drone */}
                  <div class="flex items-center justify-between p-4 bg-slate-950/60 rounded-xl border border-slate-800">
                    <div>
                      <h4 class="font-semibold text-slate-200 text-sm">
                        Visual Udara / Drone Aerial
                      </h4>
                      <p class="text-slate-400 text-xs">
                        Pengambilan angle cinematic menggunakan DJI Mini 2 SE
                      </p>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="text-amber-400 font-semibold text-xs">
                        + Rp250.000
                      </span>
                      <input
                        type="checkbox"
                        checked={includeDrone}
                        onChange={(e) => setIncludeDrone(e.target.checked)}
                        class="w-5 h-5 accent-amber-500 cursor-pointer rounded"
                      />
                    </div>
                  </div>

                  {/* Opsi Overtime */}
                  <div class="p-4 bg-slate-950/60 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-2">
                      <div>
                        <h4 class="font-semibold text-slate-200 text-sm">
                          Tambahan Jam Kerja (Overtime)
                        </h4>
                        <p class="text-slate-400 text-xs">
                          Rp100.000 / jam tambahan di lokasi
                        </p>
                      </div>
                      <span class="text-amber-400 font-semibold text-sm">
                        {extraHours} Jam
                      </span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="5"
                      value={extraHours}
                      onChange={(e) => setExtraHours(parseInt(e.target.value))}
                      class="w-full accent-amber-500 bg-slate-800 rounded-lg cursor-pointer h-2"
                    />
                  </div>
                </div>

                {/* TOTAL & CTA */}
                <div class="mt-8 pt-6 border-t border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div>
                    <span class="text-slate-400 text-xs block">
                      Estimasi Total Biaya
                    </span>
                    <span class="text-3xl font-extrabold text-white">
                      {formatRupiah(totalPrice)}
                    </span>
                  </div>
                  <a
                    href={waLink}
                    target="_blank"
                    rel="noopener noreferrer"
                    class="w-full md:w-auto inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-amber-500/20"
                  >
                    <i data-lucide="message-circle" class="w-5 h-5"></i>{" "}
                    Konsultasi via WhatsApp{" "}
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  </a>
                </div>
              </div>
            </section>

            {/* KONTAK & FOOTER SECTION (#contact) */}
            <footer
              id="contact"
              class="py-16 bg-slate-950 border-t border-slate-900 px-6"
            >
              <div class="max-w-4xl mx-auto text-center space-y-6">
                <h2 class="text-2xl font-bold text-white">
                  Siap Mengabadikan Momen Anda?
                </h2>
                <p class="text-slate-400 text-sm max-w-md mx-auto">
                  Diskusi lebih lanjut mengenai jadwal acara, lokasi, atau
                  konsep khusus melalui kontak di bawah ini.
                </p>

                <div class="flex justify-center gap-6 pt-2">
                  <a
                    href={waLink}
                    target="_blank"
                    rel="noopener noreferrer"
                    class="p-3 bg-slate-900 border border-slate-800 rounded-full hover:border-amber-500/50 text-amber-400 transition-colors"
                  >
                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                  </a>
                  <a
                    href="https://instagram.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="p-3 bg-slate-900 border border-slate-800 rounded-full hover:border-amber-500/50 text-amber-400 transition-colors"
                  >
                    <i data-lucide="film" class="w-6 h-6"></i>
                  </a>
                  <a
                    href="https://youtube.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="p-3 bg-slate-900 border border-slate-800 rounded-full hover:border-amber-500/50 text-amber-400 transition-colors"
                  >
                    <i data-lucide="tv-minimal-play" class="w-6 h-6"></i>
                  </a>
                </div>

                <p class="text-xs text-slate-600 pt-8">
                  &copy; {new Date().getFullYear()} Visual Storyteller. All
                  rights reserved.
                </p>
              </div>
            </footer>

            {/* MODAL POP-UP YOUTUBE EMBED */}
            {activeVideoId && (
              <div class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                <div class="relative w-full max-w-3xl bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
                  <button
                    onClick={() => setActiveVideoId(null)}
                    class="absolute top-3 right-3 z-10 bg-slate-950/80 text-slate-400 hover:text-white p-2 rounded-full"
                  >
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>
                  <div class="aspect-video w-full">
                    <iframe
                      class="w-full h-full"
                      src={`https://www.youtube.com/embed/${activeVideoId}?autoplay=1`}
                      title="YouTube Video Player"
                      frameBorder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowFullScreen
                    ></iframe>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<MainApp />);
    </script>
  </body>
</html>
